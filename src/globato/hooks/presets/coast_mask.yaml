name: coast-mask
description: "Source-scoped Coast Mask, independent source grids, and ordinary MultiStack; no interpolation."
hooks:
  - name: coast_mask_side_stack
    args:
      res: 0.1111111s
      crs: EPSG:4326
  - name: coast_mask_finalize
    args:
      res: 0.1111111s
      crs: EPSG:4326
  - name: stack_combine
    args:
      res: 0.1111111s
      crs: EPSG:4326
      strategy: mixed
      missing: error
      output: "%tile_dir%/%name%_%batch_name%_stack.tif"
