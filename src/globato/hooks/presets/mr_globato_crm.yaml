name: mr-globato-crm
description: "The standard CRM step-down, trim, and visualize pipeline."
hooks:
  - preset: mr-globato
    args:
      - name: ms_binary_cudem
        args:
          steps: 3
          resolutions: 1s/3s/9s/15s
          weights:
            - .5
            - 0.25
            - 0.1
          # algos: raster_fill
          algos: raster_fill/raster_fill/raster_fill/interp_gmt:tension=1,verbose=True
          blend_dists: 16/8/4/2
      - name: side_stack_check
        args:
          res: 1s
          crs: "EPSG:4326+3855"
      - name: side_stack
        args:
          res: 1s
          crs: "EPSG:4326+3855"
      - name: multi_stack
        args:
          res: 1s
          crs: "EPSG:4326+3855"
          weight_threshold: 3/2/1/.75/.5/.25/.1
      - name: source_masks
        args:
          res: 1s
      - name: provenance
        args:
          res: 1s
      - name: raster_metadata
        args:
          tags: "Project=Coastal Relief Model,Version=6,Author=NCEI"
      - name: viz_geoshade
        args:
          z_min: -3000
          z_max: 1000
