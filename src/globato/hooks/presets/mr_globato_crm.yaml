name: mr-globato-crm
description: "The standard CRM step-down, trim, and visualize pipeline."
tags:
  - globato-dem
  - dem
hooks:
  - preset: mr-globato
    args:
      - name: ms_binary_cudem
        args:
          steps: 3
          resolutions: 1s/3s/9s/15s
          # Multibeam stack weights are ~0.8-0.95, so a top tier of 0.6 grids it
          # at 1" (with 1/0.5/0.25 it was gridded at 3"). Other datasets keep
          # their tiers (module weights are >= 1 or <= 0.5; checked on the 330
          # Southern California CRM tiles).
          weights:
            - 0.6
            - 0.4
            - 0.2
          # algos: raster_fill
          algos: raster_fill/raster_fill/raster_fill/interp_gmt:tension=1,verbose=True
          blend_dists: 32/16/8/4
      - name: side_stack_check
        args:
          res: 1s
          crs: "EPSG:4326+3855"
      - name: side_stack
        args:
          res: 1s
          crs: "EPSG:4326+3855"
      - name: multi_stack
        args:
          res: 1s
          crs: "EPSG:4326+3855"
      - name: source_masks
        args:
          res: 1s
      - name: provenance
        args:
          res: 1s
      - name: raster_metadata
        args:
          tags: "Project=Coastal Relief Model,Version=6,Author=NCEI"
      - name: viz_geoshade
        args:
          z_min: -3000
          z_max: 1000

  # Multibeam (mbdb) filtering, in place of rq (see crm-bathy-topo). Listed
  # after the mr-globato preset so it runs after that preset's global manifest
  # hooks (file selection) and before multi_stack. It filters on a 1/9" grid
  # and stacks the accepted measurements on the 1" grid. The interpolation
  # block is its working-DEM ladder, written for the 1" grid like
  # ms_binary_cudem above; keep the two in step.
  - name: stack_qc
    args:
      modules: mbdb
      stage: manifest
      res: 1s
      crs: "EPSG:4326+3855"
      qc_res: 1/9s
      aggressiveness: 2
      terrain_restoration: 2
      max_passes: 5
      stop_when_stable: false
      interpolation:
        steps: 3
        resolutions: 1s/3s/9s/15s
        weights: [0.6, 0.4, 0.2]
        algos: raster_fill/raster_fill/raster_fill/interp_gmt:tension=1
        blend_dists: 32/16/8/4
        barrier: osm
        previous_tier_resampling: cubic_spline
        bathy_max_z: "ocean:-0.01,river:0,lake:None,wetland:None,estuary:0"
