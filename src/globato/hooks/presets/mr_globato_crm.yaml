name: mr-globato-crm
description: "The standard CRM step-down, trim, and visualize pipeline."
hooks:
  - preset: mr-globato
    args:
      - name: ms_binary_cudem
        args:
          steps: 3
          resolutions: 1s/3s/9s/15s
          weights:
            - 1.0
            - 0.5
            - 0.25
          blend_dists: 30/10/5/2
      - name: side_stack_check
        args:
          res: 1s
          crs: "EPSG:4326+3855"
      - name: side_stack
        args:
          res: 1s
          crs: "EPSG:4326+3855"
      - name: multi_stack
        args:
          res: 1s
          crs: "EPSG:4326+3855"
          weight_threshold: 1.0/0.5/.25
      - name: source_masks
        args:
          res: 1s
      - name: provenance
        args:
          res: 1s
      - name: raster_metadata
        args:
          tags: "Project=Coastal Relief Model,Version=6,Author=NCEI"
      - name: viz_geoshade
        args:
          z_min: -3000
          z_max: 1000
