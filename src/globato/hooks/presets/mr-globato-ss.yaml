name: mr-globato-test
description: "The standard Multi-Resolution Global Bathymetry and Topography pipeline."
tags:
  - globato-dem
  - dem
hooks:
  - name: spatial-crop
  - name: audit
  - name: enrich
  - name: transfer_log
  - name: drop_class

  - name: side_stack
    args:
      res: 3s
      crs: epsg:4326+3855

  - name: fusion_consistency
    args:
      group_by: survey_id
      hard: true
      floor: 0.1
      sigma: 4
      min_residual: 5
      source_artifact: side-stack
      output_artifact: qc-side-stack

  - name: stack_combine
    args:
      res: 3s
      strategy: mixed
      weight_threshold: 1/2/4
      source_artifact: qc-side-stack
      missing: error
      output: multi_stack.tif
      state: multi_stack.fusion.tif
      crs: epsg:4326+3855
      #output: "%name%_%batch_name%_stack.tif"

  - name: fusion_provenance
    args:
      stage: stack
      source_artifact: qc-side-stack
      state_dir: provenance_state
      output: stack_sources.vrt
      vector_output: stack_sources.gpkg
      group_by: MODULE/WEIGHT
  # - name: stack_provenance
  #   args:
  #     storage: disk
  #     output: "%name%_%batch_name%_stack_sources.vrt"
  #     vector_output: "%name%_%batch_name%_sm.gpkg"
  #     group_by: MODULE/WEIGHT

  - name: focus_sink
    args:
      target: multi_stack

  - name: raster_stream
    args:
      stream_type: raster
      chunk_size: 2048
      stage: collection

  # --- Testing MS-QUALITY ---
  # - name: ms_support_weight
  #   args:
  #     radius: 5
  #     floor: 0.6
  #     power: 0.5
  #     min_neighbors: 4

  # - name: ms_consistency_weight
  #   args:
  #     radius: 5
  #     method: mad
  #     min_count: 1
  #     max_count: 4
  #     sigma: 3
  #     max_residual: 20
  #     floor: 0.6
  #     min_neighbors: 8

  - name: ms_binary_cudem
    args:
      resolutions: 3s/9s/15s
      weights:
        - 0.25
        - 0.1
      steps: 2
      blend_dists: 0/0/0
      barrier: osm
      previous_tier_resampling: "cubic_spline"
      bathy_max_z: "ocean:-0.01,river:0,lake:None,wetland:None,estuary:0"
      # algos: interp_gmt
      # algos: "interp_gmt:tension=1/interp_gmt:tension=.75/interp_gmt:tension=.35"
      # algos: raster_fill/interp_rbf
      # algos: raster_fill:max_distance=6/raster_fill:max_distance=12/interp_gmt:tension=.95
      algos: raster_fill
      output: "%name%_%batch_name%.tif"

  - name: focus_sink
    args: {target: "ms_binary_cudem"}

  - name: raster_metadata
    args:
      tags: "Project=Coastal Relief Model,Version=6,Author=NCEI"
      bands: "Elevation (meters)"

  - name: format_cog
    args:
      overviews: 2/4/8/16/32
      resampling: average

  - name: viz_geoshade
    args:
      output: "%name%_%batch_name%_hs.tif"
      cmap: coastal_relief
      cog: true

  - name: cleanup_tmp
    args: {"target_dir": "tmp"}

  - name: copy_artifact
    args:
      target_dir: "%outdir%/delivery"
      match:
        - "%name%_%batch_name%.tif"

  - name: copy_artifact
    args:
      target_dir: "%outdir%/delivery/hs"
      match:
        - "%name%_%batch_name%_hs.tif"
