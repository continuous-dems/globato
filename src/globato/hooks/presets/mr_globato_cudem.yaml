name: mr-globato-cudem
description: "The standard CUDEM step-down, trim, and visualize pipeline."
hooks:
  - preset: mr-globato
    args:
      - name: ms_binary_cudem
        args:
          steps: 5
          resolutions: .1111111s/.3333333s/1s/3s/9s/15s
          weights:
            - 2.0
            - 1.0
            - .5
            - 0.25
            - 0.1
          blend_dists: 64/32/16/8/4/2
          # blend_dists: 0
          # algos: raster_fill/raster_fill/raster_fill/raster_fill/raster_fill/interp_gmt:tension=.95
          algos: raster_fill/raster_fill/raster_fill/raster_fill/interp_gmt:tension=1,verbose=True
      - name: side_stack_check
        args:
          res: .11111111s
          crs: "EPSG:4269+5703"
      - name: side_stack
        args:
          res: .11111111s
          crs: "EPSG:4269+5703"
      - name: multi_stack
        args:
          res: .1111111s
          crs: "EPSG:4269+5703"
      - name: source_masks
        args:
          res: .1111111s
      - name: provenance
        args:
          res: .1111111s
      - name: raster_metadata
        args:
          tags: "Project=CUDEM,Author=NCEI"
      - name: viz_geoshade
        args:
          z_min: -2000
          z_max: 1000
