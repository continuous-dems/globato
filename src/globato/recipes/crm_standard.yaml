project:
  name: "crm-standard"
  description: >
    Production-grade 1-arc-second Coastal Relief Model.
    Blends high-res local topo (CoNED, 3DEP) with dense bathymetry
    (MBDB, NOS, eHydro) and fills deep water with GEBCO.
    Includes an embedded Spatial Uncertainty Band (Band 2).
  tags:
    - globato

execution:
  threads: 4

schemas:
  - name: validate-recipe
  - name: validate-paths
  - name: validate-parameters

modifiers:
  - name: buffer-and-cut
    args:
      pct: 20
      # Must match the DEM written by the global_hooks preset.
      outname: "%name%_%batch_name%"

modules:
  - bundle: crm-bathy-topo

global_hooks:
  - preset: mr-globato-crm

