project:
  name: "etopo-standard"
  description: >
    Production-grade 3-arc-second ETOPO.
  tags:
    - globato

execution:
  threads: 4

schemas:
  - name: validate-recipe

modifiers:
  - name: ensure-spatial-claim
    args:
      res: 3s
  - name: ensure-hook
    args:
      when:
        hook: stack_qc
        args:
          viz: true
      ensure:
        name: stack_qc_review
        scope: global
        position: append

modules:
  - bundle: global-bathy-topo

global_hooks:
  - preset: mr-globato
