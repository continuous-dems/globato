---
project:
  name: "cudem-standard"
  description: >
    Production-grade 1/9-arc-second CUDEM.
  tags:
    - globato

execution:
  threads: 4

schemas:
  - name: validate-recipe
  - name: validate-paths
  - name: validate-parameters

modifiers:
  - name: buffer-and-cut
    args:
      pct: 10
      # Must match the DEM written by the global_hooks preset.
      outname: "%name%_%batch_name%"

modules:
  - bundle: cudem-bathy-topo

global_hooks:
  - preset: mr-globato-cudem
