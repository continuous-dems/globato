name: nos-xyz
description: NOS Hydro data to stream elevation points
stream-type: "point-stream"
reader:
  name: "xyz-point-reader"
  args:
    delimiter: ","
    skiprows: 1
    z_scale: -1
    usecols: [2, 1, 3]
    names: ["y", "x", "z"]
    # drop soundings NOS marks inactive (active == 0); set keep_pos to null to keep them
    keep_pos: 5
    keep_values: [1]
