---
name: crm-bathy-topo
description: >
  Common data sources for coastal relief models.
  Adds some US-specific datasets to the global-bathy-topo bundle.
  Built for 1 arc-seconds @ epsg:4326+3855
tags:
  - globato
  - bathymetry
  - topography
  - crm
  - glob-stream
  - glob-bundle
modules:
  - bundle: global-bathy-topo
    hooks:
      - name: raster_warp
        args:
          res: 1s
      - name: point_raster_mask
        args:
          res: 1s
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"

  # TNM NED 1
  - module: tnm
    args: {weight: 0.5, formats: "GeoTIFF", datasets: "1"}
    hooks:
      - name: spatial_cull
        args:
          sort_by: "date"
          min_coverage: 0.98
      - name: raster_flats
        args:
          stage: "file"
      - name: raster_warp
        args: {res: 1s}
      - name: set-srs
        args:
          srs: "EPSG:4269+5703"
      - name: stream_data
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: point_raster_mask
        args:
          barrier: "coastline"
          invert: False
          res: 1s
      - name: spatial_crop
      - name: range_z
        args: {min_z: 0.01}

  # TNM NED 1/3
  - module: tnm
    args: {weight: 1.0, formats: "GeoTIFF", datasets: "3"}
    hooks:
      - name: spatial_cull
        args:
          sort_by: "date"
          min_coverage: 0.98
      - name: raster_flats
        args:
          stage: "file"
      - name: set-srs
        args:
          srs: "EPSG:4269+5703"
      - name: raster_warp
        args: {res: 1s}
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: point_raster_mask
        args:
          barrier: "coastline"
          invert: False
          res: 1s
      - name: spatial_crop
      - name: range_z
        args: {min_z: 0.01}

  # --- HIGH RES BATHYMETRY ---
  - module: nos_hydro
    args:
      datatype: bag
      weight: 1.0
    hooks:
    - name: filename_filter
      args:
        exclude: Ellipsoid
        stage: pre
    - name: set_datatype
      args:
        data_type: bag
    - name: stream_reproject
      args:
        dst_srs: "EPSG:4326+3855"
        cache_dir: "%shared_cache%"
    - name: spatial_crop

    # NOS Hydro surveys
  - module: nos_hydro
    args:
      datatype: "xyz"
      weight: .35
    hooks:
      - name: unzip
      - name: set_datatype
        args:
          data_type: "nos-xyz"
      - name: set-srs
        args:
          srs: "EPSG:4326+vdatum:mllw"
      - name: dynamic-weight
        args:
          source_field: "date"
          method: "chronological"
          seed: 2010
          offset: .01
          scale: 5
          cap: .5
          on_entry: true
          stage: manifest
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: spatial_crop
      - name: outlierz
      - name: range_z
        args: {max_z: -0.01}

  # NOAA Electronic Nautical Charts
  - module: charts
    args:
      weight: .15
    hooks:
      - name: unzip
      - name: filename_filter
        args:
          match: ".000"
          stage: "file"
      - name: set_datatype
        args:
          data_type: "charts-xyz"
      - name: set-srs
        args:
          srs: "EPSG:4326+vdatum:mllw"
      - name: stream_data
        args:
          chunk_size: 100000
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: spatial_crop
