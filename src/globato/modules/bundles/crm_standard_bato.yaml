---
name: crm-bathy-topo
description: >
  Common data sources for coastal relief models.
  Adds some US-specific datasets to the global-bathy-topo bundle.
  Built for 1 arc-seconds @ epsg:4326+3855
tags:
  - globato
  - bathymetry
  - topography
  - crm
  - glob-stream
  - glob-bundle
modules:
  # Every global-bathy-topo member except mbdb, which is defined below with
  # Stack QC instead of rq. Add new global-bathy-topo modules here too.
  - bundle: global-bathy-topo
    select:
      module:
        - copernicus
        - sysu
        - margrav
    hooks:
      - name: raster_warp
        args:
          res: 1s
      - name: point_raster_mask
        args:
          res: 1s
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"

  # NCEI Multibeam, filtered with Stack QC instead of global-bathy-topo's rq
  # (same module arguments and source hooks as there). Stack QC
  # runs at the collection stage on the sources' side-stacks; it filters on a
  # 1/9" grid and hands accepted 1" side-stacks to stack_combine. The
  # interpolation block is the working-DEM ladder, written for the 1" DEM grid
  # (scaled down to qc_res); keep it in step with ms_binary_cudem in
  # mr-globato-crm.
  - module: mbdb
    args: {weight: 1, want_inf: True, use_cache: true}
    hooks:
      - name: filename_filter
        args:
          match: ".fbt"
      - name: set-srs
        args:
          srs: "EPSG:4326+vdatum:msl"
      - name: stream_data
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: stack_qc
        args:
          res: 1s
          crs: "EPSG:4326+3855"
          qc_res: 1/9s
          aggressiveness: 2
          terrain_restoration: 2
          max_passes: 5
          stop_when_stable: false
          interpolation:
            steps: 3
            resolutions: 1s/3s/9s/15s
            weights: [0.6, 0.4, 0.2]
            algos: raster_fill/raster_fill/raster_fill/interp_gmt:tension=1
            blend_dists: 32/16/8/4
            barrier: osm
            previous_tier_resampling: cubic_spline
            bathy_max_z: "ocean:-0.01,river:0,lake:None,wetland:None,estuary:0"

  # TNM NED 1
  - module: tnm
    args: {weight: 0.5, formats: "GeoTIFF", datasets: "1"}
    hooks:
      - name: spatial_cull
        args:
          sort_by: "date"
          min_coverage: 0.98
      - name: raster_flats
        args:
          stage: "file"
      - name: raster_warp
        args: {res: 1s}
      - name: set-srs
        args:
          srs: "EPSG:4269+5703"
      - name: stream_data
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: point_raster_mask
        args:
          barrier: "coastline"
          invert: False
          res: 1s
      - name: spatial_crop
      - name: range_z
        args: {min_z: 0.01}

  # TNM NED 1/3
  - module: tnm
    args: {weight: 1.0, formats: "GeoTIFF", datasets: "3"}
    hooks:
      - name: spatial_cull
        args:
          sort_by: "date"
          min_coverage: 0.98
      - name: raster_flats
        args:
          stage: "file"
      - name: set-srs
        args:
          srs: "EPSG:4269+5703"
      - name: raster_warp
        args: {res: 1s}
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: point_raster_mask
        args:
          barrier: "coastline"
          invert: False
          res: 1s
      - name: spatial_crop
      - name: range_z
        args: {min_z: 0.01}

  # --- HIGH RES BATHYMETRY ---
  - module: nos_hydro
    args:
      datatype: bag
      weight: 1.0
    hooks:
    - name: filename_filter
      args:
        exclude: Ellipsoid
        stage: pre
    - name: set_datatype
      args:
        data_type: bag
    - name: stream_reproject
      args:
        dst_srs: "EPSG:4326+3855"
        cache_dir: "%shared_cache%"
    - name: spatial_crop

    # NOS Hydro surveys
  - module: nos_hydro
    args:
      datatype: "xyz"
      weight: .5
    hooks:
      - name: unzip
      - name: set_datatype
        args:
          data_type: "nos-xyz"
      - name: set-srs
        args:
          srs: "EPSG:4326+vdatum:mllw"
      - name: dynamic-weight
        args:
          source_field: "date"
          method: "chronological"
          seed: 2000
          offset: .1
          scale: 5
          cap: .5
          on_entry: true
          stage: manifest
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: spatial_crop
      - name: outlierz
      - name: range_z
        args: {max_z: -0.01}

  # NOS Hydro Gridded_Data surveys
  - module: nos_hydro
    args:
      datatype: "grid"
      weight: 1
    hooks:
      - name: unzip
      - name: set_datatype
        args:
          data_type: "nos-grid"
      - name: set-srs
        args:
          horz_srs: "auto_utm"
          vert_srs: "vdatum:mllw"
      - name: dynamic-weight
        args:
          source_field: "date"
          method: "chronological"
          seed: 2010
          offset: .01
          scale: 5
          cap: 1
          on_entry: true
          stage: manifest
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: spatial_crop
      - name: outlierz
      - name: range_z
        args: {max_z: -0.01}

  # NOAA Electronic Nautical Charts
  - module: charts
    args:
      weight: .085
    hooks:
      - name: unzip
      - name: filename_filter
        args:
          match: ".000"
          stage: "file"
      - name: set_datatype
        args:
          data_type: "charts-xyz"
      - name: set-srs
        args:
          srs: "EPSG:4326+vdatum:mllw"
      - name: stream_data
        args:
          chunk_size: 100000
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: spatial_crop
