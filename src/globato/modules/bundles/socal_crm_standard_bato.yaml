---
name: socal-crm-bathy-topo
description: >
  Data sources for the southern california coastal relief model.
  Built for 1 arc-seconds @ epsg:4326+3855
tags:
  - globato
  - bathymetry
  - topography
  - crm
  - glob-stream
  - glob-bundle
  - socal
  - california
modules:
  - bundle: crm-bathy-topo
    hooks:
      - name: raster_warp
        args:
          res: 1s
      - name: point-raster-mask
        args:
          res: 1s
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"

  # - module: coned
  #   args: {weight: 5.0}
  #   hooks:
  #     - name: filename_filter
  #       args: {exclude: "Southern_California_Topobathy_DEM_1m_B_01.tif"}
  #     - name: filename_filter
  #       args: {exclude: "Southern_California_Topobathy_DEM_1m_B_02.tif"}
  #     - name: stream_data
  #     - name: range_z
  #       # Trench to Peak range to remove extreme artifacts.
  #       args: {min_z: -11000, max_z: 9000}
  #     - name: stream_reproject
  #       args: {dst_srs: "EPSG:4326+3855"}
  #     - name: spatial_crop

  - module: cudem
    args: {weight: 3.0}
    hooks:
      - name: set-srs
        args:
          srs: "EPSG:4269+5703"
      - name: stream_reproject
        args: {dst_srs: "EPSG:4326+3855", cache_dir: "%shared_cache%"}
      - name: spatial_crop

  - module: dav
    args:
      survey_id: '2616'
      datatype: dem
      weight: 10.0
    hooks:
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"

  - module: usgs_ds781
    hooks:
      - name: filename_filter
        args:
          match: "Bathymetry"
          stage: manifest
      - name: filename_filter
        args:
          exclude: "BathymetryHS"
          stage: manifest
      - name: unzip
      - name: filename_filter
        args:
          match: ".tif"
      - name: filename_filter
        args:
          exclude: ".tif."
      - name: filename_filter
        args:
          exclude: "._Bathymetry"
      - name: raster_warp
        args:
          dst_crs: "EPSG:4326"
          res: 1s
      - name: set-srs
        args:
          srs: "EPSG:4326+5703"
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"

  - module: usgs_ds487
    hooks:
      - name: unzip
      - name: filename_filter
        args:
          stage: "file"
          match: ".txt"
      - name: set_datatype
        args:
          data_type: "rio"
      # No .prj in the DS 487 grids.
      - name: set-srs
        args:
          srs: "EPSG:26911+5703"
      # Bathymetry only; land comes from the lidar and NED sources.
      - name: range_z
        args:
          max_z: 0
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"


  - module: usgs_ds702
    hooks:
      - name: unzip
      - name: filename_filter
        args:
          stage: "file"
          match: ".asc"
      - name: set_datatype
        args:
          data_type: "rio"
      - name: set-srs
        args:
          srs: "EPSG:26911+5703"
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"


  - module: usgs_sim3324
    args:
      datatype: "ascii"
    hooks:
      - name: unzip
      - name: filename_filter
        args:
          stage: "file"
          match: ".asc"
      - name: set_datatype
        args:
          data_type: "rio"
      - name: set-srs
        args:
          rules:
            mv1316_25mbathy: "EPSG:32611+vdatum:mllw"
            s_ca_25mbathy: "EPSG:26911+5703"
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"


  - module: usgs_of2014_1094
    args:
      datatype: "bathymetry"
    hooks:
      - name: filename_filter
        args:
          exclude: "STDDEV"
          stage: manifest
      - name: filename_filter
        args:
          exclude: "_SHD"
          stage: manifest
      - name: unzip
      - name: filename_filter
        args:
          stage: "file"
          match: ".asc"
      - name: set_datatype
        args:
          data_type: "rio"
      - name: set-srs
        args:
          srs: "EPSG:26911+5703"
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"

