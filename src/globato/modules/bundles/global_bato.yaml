  # NCEI Multibeam
  - module: mbdb
    args: {weight: 1, want_inf: True, use_cache: true}
    hooks:
      - name: filename_filter
        args:
          match: ".fbt"
      - name: set-srs
        args:
          srs: "EPSG:4326+vdatum:msl"
      - name: stream_data
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: rq
        args:
          reference: "gmrt/gebco"
          threshold: 5
          mode: "percent"
          builder: "grid"
          res: 1s

  # Global Marine Gravity Bathymetry
  - module: sysu
    args:
      weight: .01
    hooks:
      - name: set-datatype
        args:
          data_type: sysu-xyz
      - name: set-srs
        args:
          srs: "EPSG:4326+global:mss"
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: rq
        args:
          reference: "gmrt/gebco"
          threshold: 20
          mode: "percent"
          builder: "grid"
          res: 60s

  # Global Marine Gravity Bathymetry
  - module: margrav
    args:
      weight: .01
    hooks:
      - name: set-datatype
        args:
          data_type: margrav-xyz
      - name: set-srs
        args:
          srs: "EPSG:4326+global:mss"
      - name: range_z
        args:
          max_z: -0.1
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: rq
        args:
          reference: "gmrt/gebco"
          threshold: 20
          mode: "percent"
          builder: "grid"
          res: 60s

  - module: csb
    args:
      weight: 0.25
      min_year: null
      max_year: null
      platform: null
      provider: null
      limit: 2000
      outdir: null
      uncertainty: 0.0
      use_cache: true
    hooks:
      - name: set-datatype
        args:
          data_type: csb_xyz
      - name: set-srs
        args:
          srs: "EPSG:4326+global:mss"
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: rq
        args:
          reference: "gebco"
          threshold: 20
          mode: "percent"
          builder: "grid"
          res: 3s

