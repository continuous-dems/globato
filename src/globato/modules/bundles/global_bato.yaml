name: global-bathy-topo
desc: >
  The definitive collection for US coastal topobathy.
  Prioritizes high-resolution local LiDAR (CoNED) and USGS topo (TNM),
  backed by dense US bathymetry (NOS Hydro, eHydro). Sets data up for
  global streaming hooks.
tags:
  - globato
  - bathymetry
  - topography
  - global
  - glob-stream
  - glob-bundle
modules:
  # - module: fabdem
  #   args: {weight: 1.5}
  #   hooks:
  #     - name: unzip
  #     - name: filename_filter
  #       args: {match: ".tif"}
  #     - name: set_datatype
  #       args:
  #         data_type: "rio"
  #     - name: range_z
  #       args: {min_z: 0.01}
  - module: copernicus
    args: {weight: .5, datatype: 3}
    hooks:
      - name: unzip
      - name: filename_filter
        args:
          match: ".tif"
      - name: set-srs
        args:
          srs: "EPSG:4326+3855"
      - name: raster_warp
        args:
          res: 3s
      - name: point_raster_mask
        args:
          barrier: "coastline"
          invert: False
          res: 3s
      - name: set_datatype
        args:
          data_type: "rio"
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: range_z
        args: {min_z: 0.01}

  - module: copernicus
    args: {weight: .35, datatype: 1}
    hooks:
      - name: unzip
      - name: filename_filter
        args: {match: ".tif"}
      - name: set-srs
        args:
          srs: "EPSG:4326+3855"
      - name: raster_warp
        args: {res: 9s}
      - name: point_raster_mask
        args:
          barrier: "coastline"
          invert: False
          res: 3s
      - name: set_datatype
        args:
          data_type: "rio"
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: range_z
        args: {min_z: 0.01}

