name: glob-dav
description: "NOAA Digital Coast Lidar - with dynamic weighting and clipping."
tags:
  - globato
  - bathymetry
  - topography
  - lidar
  - glob-stream
modules:
  - module: dav
    hooks:
      - name: dynamic-weight
        args:
          source_field: "year"
          method: "chronological"
          seed: 2010
          offset: 1
          scale: 3.5
          on_entry: true
          stage: manifest
      - name: spatial_cull
        args:
          sort_by: "year"
          min_coverage: 0.95
          group_by: "is_bathy"
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4269+5703"
          cache_dir: "%shared_cache%"
      # - name: point_raster_mask
      #   args:
      #     barrier: "coastline"
      #     invert: false
      #     res: .11111111s
      #     skip_entry: "is_bathy"
      - name: water_surface_filter
        args:
          barrier: "osm"
          invert: false
          res: 1s
          skip_entry: "is_bathy"
          hard_clip_below: 1.1
