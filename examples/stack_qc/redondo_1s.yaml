# NAD83 geographic study bounds in west/east/south/north order.
# Stack QC automatically manages its source side-stacks.
project:
  name: stack_qc_redondo_1s
region:
- -118.55
- -118.5
- 33.77
- 33.81
region_srs: EPSG:4269
execution:
  threads: 4
modules:
- module: mbdb
  args:
    weight: 1
    want_inf: true
    use_cache: true
  hooks:
  - name: set_srs
    args:
      srs: EPSG:4326+vdatum:msl
  - name: stream_data
  - name: stream_reproject
    args:
      dst_srs: EPSG:4269+5703
  - name: stack_qc
    args:
      aggressiveness: 2
      terrain_restoration: 2
      max_passes: 5
      stop_when_stable: false
      review: true
global_hooks:
- name: spatial_crop
- name: multi_stack
  args:
    res: 1s
    crs: EPSG:4269+5703
    strategy: mixed
    weight_threshold: 3/2/1/.75/.5/.4/.3/.2/.1
    resume: false
    output: source_stack.tif
- name: focus_sink
  args:
    target: multi_stack
- name: raster_stream
  args:
    stream_type: raster
    stage: collection
- name: ms_binary_cudem
  args:
    steps: 3
    resolutions: 1s/3s/9s/15s
    weights: 2/1/.5
    blend_dists: 64/32/16/8
    algos: raster_fill/raster_fill/raster_fill/interp_gmt:tension=.95
    previous_tier_resampling: cubic_spline
    barrier: null
    inland_decay_dist: 0
    keep_steps: false
    output: final_dem.tif
